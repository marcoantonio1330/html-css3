<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            
        }

        table{
            width: 400px;
            height: 400px;
            border-collapse: collapse; 
            
        
        }

        td{
              border: 1px solid black;
              padding: 8px;
              text-align:center;
              /*aliamento horizontal */
              vertical-align:middle;
              /*aliamento na vertical propriedades bottom (baixo), middle (meio) e top(cima)*/
        }

        .numero{
            text-align: center;
        }
    </style>
</head>
<body>
    <!--hiraequia de tabelas
    table = tabela
         table row = linha de tabela
         table heard = cabeçalho de tabela
            table data = dados tabela  
    
    -->
    <h1>minha primeira tabela</h1>
    <table>
        <tr><!--primeira linha -->
            <td>ale</td>
            <td>dany</td>
            <td>pau</td>
        </tr>
        <tr><!-- segunda linha -->
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr><!--- terceira linha-->
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr><!--quarta linha -->
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
    
</body>
</html>
