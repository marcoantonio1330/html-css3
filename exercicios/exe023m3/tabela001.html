<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            
        }

        table{
            width: 400px;
            border-collapse: collapse; 
            
        }
        tr.linha{
            background-color: gray;
        }

        td{
              border: 1px solid black;
              padding: 8px;
        }

        td.dado{
            background-color: rgb(58, 197, 240);
            border: 1px solid rgb(51, 216, 238);
            
        }

        td.dado2{
            background-color:yellow;
            border: 1px solid rgb(255, 255, 0);
        }

        td.dado3{
            background-color: pink;
            border: 1px solid pink;
        }
        
        p{
            color: red;
            border: 3px solid yellow;
            background-color: yellow;

        }
    </style>
</head>
<body>
    <!--hiraequia de tabelas
    table = tabela
         table row = linha de tabela
         table heard = cabeçalho de tabela
            table data = dados tabela  
    
    -->
    <h1>minha primeira tabela</h1>
    <table>
        <tr><!--primeira linha -->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr class="linha"><!-- segunda linha -->
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr><!--- terceira linha-->
            <td >A3</td>
            <td class="dado3">patrona</td>
            <td >C3</td>
        </tr>
        <tr><!--quarta linha -->
            <td>A4</td>
            <td class="dado2">Dany</td>
            <td>C4</td>
        </tr>
        <tr>
            <td>A5</td>
            <td class="dado">Ale</td>
            <td>C5</td>
        </tr>
        <tr>
            <td>A6</td>
            <td>B6</td>
            <td>C6</td>
        </tr>
    </table>
    <p>Obs:para colovar os dado em forma horizontal devemos colocar eles na mesma linnha, para colocar os dados na vertical tem que colocar em linhas diferentes </p>
</body>
</html>
