<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fontes externas </title>
    <style>
        @font-face {
            font-family:'matcha';
            src: url('fonts/Matcha\ Cih.otf') format('opentype'),url('fonts/Matcha\ Cih.ttf') format('truetype');
              font-weight: normal;
              font-style: normal;
        }
            /*
            
            tipos de format()
            -opentype(otf)
            - truetype(ttf)
            - embedded - opentype 
            - truetpe - att(apple advanced typograpyh)
            - svg

            
            */

        
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{
            font-family: 'matcha', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
        p{
            font-family:'Times New Roman', Times, serif;
        }
    </style>
</head>
<body>
    <h1>titulo</h1>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Asperiores quaerat voluptatem ut quas, corporis, officiis repellendus modi, dolorum minus nisi quasi perferendis temporibus laboriosam quibusdam similique accusantium quia alias rem.</p>
</body>
</html>
