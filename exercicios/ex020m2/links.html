<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        /* Seletores personalizados
        # = id
        . = class
        : = pseudo - class
        :: = pseudo - element
        > = clildren
        
        
        
        
        */
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a{
           color: red; 
           text-decoration: none;
           font-weight: bold;
        }
        a:visited{/*cor do links que foram visitados*/
            color: darkred;
        }
        a:hover{/* hover passar o mouse em cima */
            text-decoration:underline;
            color:black;
        }
        a:active{/*cor do link ativo quando clicar nele  */
            color: yellow;
        }

        .especial{
            background-color: rgba(190, 94, 94, 0.733);
            

        }

        .especial::before{/*faz muundaças antes do conteudo */
            content: '➝';
        }
        .especial::after{/*faz mudanças direto no conteudo  no caso depois do conteudo*/
            content: '←';
            text-decoration: none;
            font-weight: normal;
            

        }
    </style>
</head>
<body>
    <h1>personalizado links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io" target="_blank">repositorio github</a></li>
        <li><a href="https://youtube.com/cursoemvideo/ " class="especial">canal do youtube</a> </li>
        <li><a href="https://www. cursoemvideo.com" class="especial">site do cursoemvideo</a></li>
    </ul>
</body>
</html>
