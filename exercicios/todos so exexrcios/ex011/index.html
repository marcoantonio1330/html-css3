<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> mídias em html 5 </title>
</head>
<body>
    <h1>imagem dinaminca </h1>
    <p>tente abrir esse site em varios dispositivos diferentes ou simplismente aumente ou diminua o tamanho do seu navegador </p>
    <picture>
        <source media="(max-width: 750px)" srcset="foto-p.png" type="image/png">
        <source media="(max-width:1050px)" srcset="" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexivel">
    </picture>
     <h1>reproduzindo audio</h1>
    <p>vamos aprender a reproduzir audio em html5 </p>
    <audio preload="metadata" autoplay controls loop >
        <source src="midia/The Warning - DISCIPLE (Official Music Video).mp3" type="audio/mpeg">
        <source src="midia/guanacast-33.ogg" type="audio/ogg">
        <source src="midia/guanacast-33.wav" type="audio/wav">
    </audio>
    <p>infelismente seu navegador nao consegue reproduzir audio <a href="midia/The Warning - DISCIPLE (Official Music Video).mp3" >Clique aqui para baizar o arquivo </a> </p>
    
</body>
</body>
</html>
