<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gradiente em css</title>
    <style>
        *{ /* configuraçoes globais da css */
            height:100%;
        }
        body{
          background-image: linear-gradient(to right ,#AC399C,#E03F80,#EF536A ,#F86E53 ,#FCBA3F );
          background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>testando gradientes </h1>
</body>
</html>
