<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modelos de caixas </title>
    <style>
        h1{/*BOX - LEVEL */
            background-color: lightblue;
            height: 300px;
            width: 300px;
            
            
            /*propriedades da borda e shorthand
             
            border-width: 10px; 
            border-style:solid;
            border-color: darkslategrey;
            
            border: 10px solid darkslategray;
            */
           border: 10px solid darkslategray;
           
           /*propriedades do padding e shorthand
             shorthand sempre na ordem com se fosse um relogio 
             
             1 topo
             2 right (direita)
             3 battom 
             4 left (esquerda)

             padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;

            padding:10px 10px 10px 10px;

           */

            padding:10px;
            
            /*propriedades da margin e shorthand
            
             margin-top: 20px;
            margin-right: 20px;
            margin-bottom: 40px;
            margin-left: 20px;
            
            margin:20px 20px 40px 20px;
            
            deixando centralizada 
            margin: 20px auto 40px auto 
            
            */

            margin:20px auto  40px auto;
            
            /*propriedades da outline e shorthand 
             outline-width: 5px;
            outline-style: dashed;
            outline-color: salmon;
            
            outline: 5px dashed salmon;
            
            */

            outline: 5px dashed salmon;
        }
        a{/*INLINE - LEVEL */
            
             
            border: 10px solid red;
            padding: 10px;
            
            
        }
    </style>
</head>
<body>
    <h1>exemplo de box level</h1>
    <p>paragrafos tbm sao exemplos de box level mas os <a href="#">sao exemplos sao exemplos de caixas em inline level </a>. vamos ver como tudo isso funciona  </p>
</body>
</html>
